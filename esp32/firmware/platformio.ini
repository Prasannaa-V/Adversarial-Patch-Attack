; InfraEdge-Shield — ESP32 PlatformIO Build Config
; Flash with: pio run --target upload
; Monitor serial: pio device monitor --baud 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    knolleary/PubSubClient @ ^2.8.0
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    -DMQTT_MAX_PACKET_SIZE=512
    -DARDUINO_ESP32_DEV

monitor_speed = 115200
upload_speed  = 921600
